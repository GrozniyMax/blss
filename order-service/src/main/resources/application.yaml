spring:
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studs}
    username: ${SPRING_DATASOURCE_USERNAME:s408145}
    password: ${SPRING_DATASOURCE_PASSWORD:JLzD%6772}
  liquibase:
    change-log: classpath:/db/changelog/changelog-master.xml
  artemis:
    mode: native
    broker-url: ${ARTEMIS_BROKER_URL:tcp://localhost:61616}
    user: ${ARTEMIS_USER:artemis}
    password: ${ARTEMIS_PASSWORD:artemis}
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always

server:
  port: ${SERVER_PORT:25103}

# User service URL for REST communication
user:
  service:
    url: ${USER_SERVICE_URL:http://localhost:25104}

# JMS queue names
jms:
  queue:
    order-status-changed: order.status.changed
    order-status-revert: order.status.revert

bitrix:
  enabled: ${BITRIX_ENABLED:false}
  webhook-url: ${BITRIX_WEBHOOK_URL:http://localhost/bitrix-disabled}
  document-template-id: ${BITRIX_DOCUMENT_TEMPLATE_ID:0}
  upload-to-crm-fallback: ${BITRIX_UPLOAD_TO_CRM_FALLBACK:true}
  deal-method: ${BITRIX_DEAL_METHOD:crm.deal.add.json}
  assigned-by-id: ${BITRIX_ASSIGNED_BY_ID:0}
  category-id: ${BITRIX_CATEGORY_ID:0}
  my-company-name: ${BITRIX_MY_COMPANY_NAME:}
  my-company-inn: ${BITRIX_MY_COMPANY_INN:}
  my-company-kpp: ${BITRIX_MY_COMPANY_KPP:}
  my-company-address: ${BITRIX_MY_COMPANY_ADDRESS:}
  my-company-phone: ${BITRIX_MY_COMPANY_PHONE:}
  my-company-bank-name: ${BITRIX_MY_COMPANY_BANK_NAME:}
  my-company-bik: ${BITRIX_MY_COMPANY_BIK:}
  my-company-acc-num: ${BITRIX_MY_COMPANY_ACC_NUM:}
  my-company-cor-acc-num: ${BITRIX_MY_COMPANY_COR_ACC_NUM:}
  my-company-director: ${BITRIX_MY_COMPANY_DIRECTOR:}
  default-product-measure-name: ${BITRIX_DEFAULT_PRODUCT_MEASURE_NAME:шт}
  default-tax-title: ${BITRIX_DEFAULT_TAX_TITLE:Без НДС}
  default-tax-rate: ${BITRIX_DEFAULT_TAX_RATE:Без НДС}
  default-client-phone: ${BITRIX_DEFAULT_CLIENT_PHONE:}
  inbound-webhook-token: ${BITRIX_INBOUND_WEBHOOK_TOKEN:}
  polling-enabled: ${BITRIX_POLLING_ENABLED:true}
  polling-fixed-delay: ${BITRIX_POLLING_FIXED_DELAY:30000}
