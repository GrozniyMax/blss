services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-studs
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - BLSS-labs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 10s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: "v.amuz@gmail.com"
      PGADMIN_DEFAULT_PASSWORD: "1488"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "6980:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - BLSS-labs

  artemis:
    image: apache/activemq-artemis:latest
    container_name: artemis-broker
    ports:
      - "61680:61616"  # JMS
      - "8161:8161"    # Web console
    env_file:
      - .env
    environment:
      - ARTEMIS_USER=${ARTEMIS_USER}
      - ARTEMIS_PASSWORD=${ARTEMIS_PASSWORD}
    volumes:
      - artemis_data:/var/lib/artemis
    networks:
      - BLSS-labs
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/61616'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    env_file:
      - .env
    environment:
      JAVA_OPTS: "-Djava.net.preferIPv4Stack=true"
    ports:
      - "25104:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - BLSS-labs

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      ARTEMIS_BROKER_URL: tcp://artemis:61616
      ARTEMIS_USER: ${ARTEMIS_USER}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD}
      USER_SERVICE_URL: http://user-service:8080
      JAVA_OPTS: "-Djava.net.preferIPv4Stack=true"
    ports:
      - "25103:8080"
    depends_on:
      postgres:
        condition: service_healthy
      artemis:
        condition: service_healthy
      user-service:
        condition: service_started
    networks:
      - BLSS-labs

  status-service:
    build:
      context: .
      dockerfile: status-service/Dockerfile
    container_name: status-service
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      ARTEMIS_BROKER_URL: tcp://artemis:61616
      ARTEMIS_USER: ${ARTEMIS_USER}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD}
      ORDER_SERVICE_URL: http://order-service:8080
      USER_SERVICE_URL: http://user-service:8080
      JAVA_OPTS: "-Djava.net.preferIPv4Stack=true"
    ports:
      - "25105:8080"
    depends_on:
      postgres:
        condition: service_healthy
      artemis:
        condition: service_healthy
      order-service:
        condition: service_started
    networks:
      - BLSS-labs

volumes:
  postgres_data:
  pgadmin_data:
  artemis_data:

networks:
  BLSS-labs:
    driver: bridge
