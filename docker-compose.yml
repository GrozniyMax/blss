services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-studs
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - BLSS-labs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 10s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: "v.amuz@gmail.com"
      PGADMIN_DEFAULT_PASSWORD: "1488"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "6980:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - BLSS-labs

  artemis:
    image: apache/activemq-artemis:latest
    container_name: artemis-broker
    ports:
      - "61616:61616"  # JMS
      - "8161:8161"    # Web console
    env_file:
      - .env
    volumes:
      - artemis_data:/var/lib/artemis
    networks:
      - BLSS-labs
    healthcheck:
      test: ["CMD", "bash", "-c", "nc -z localhost 61616"]
      interval: 15s
      timeout: 10s
      retries: 5

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    env_file:
      - .env
    environment:
      SERVER_PORT: 25104
    ports:
      - "25104:25104"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - BLSS-labs

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JMS_ARTEMIS_BROKER_URL: tcp://artemis:61616
      SPRING_JMS_ARTEMIS_USER: ${ARTEMIS_USER}
      SPRING_JMS_ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD}
      USER_SERVICE_URL: http://user-service:25104
      SERVER_PORT: 25103
    ports:
      - "25103:25103"
    depends_on:
      postgres:
        condition: service_healthy
      artemis:
        condition: service_healthy
      user-service:
        condition: service_started
    networks:
      - BLSS-labs

  status-service:
    build:
      context: .
      dockerfile: status-service/Dockerfile
    container_name: status-service
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JMS_ARTEMIS_BROKER_URL: tcp://artemis:61616
      SPRING_JMS_ARTEMIS_USER: ${ARTEMIS_USER}
      SPRING_JMS_ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD}
      ORDER_SERVICE_URL: http://order-service:25103
      USER_SERVICE_URL: http://user-service:25104
      SERVER_PORT: 25105
    ports:
      - "25105:25105"
    depends_on:
      postgres:
        condition: service_healthy
      artemis:
        condition: service_healthy
      order-service:
        condition: service_started
    networks:
      - BLSS-labs

volumes:
  postgres_data:
  pgadmin_data:
  artemis_data:

networks:
  BLSS-labs:
    driver: bridge
